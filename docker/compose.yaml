services:
  mysql:
    container_name: mysql
    image: mysql:8.4
    ports:
      - "${MYSQL_PORT}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      TZ: Asia/Tokyo
    healthcheck:
      # https://tech.legalscape.co.jp/entry/mysql-healthcheck
      test: ["CMD", "mysqladmin", "ping", "--protocol=TCP"]
      start_period: 10s
      timeout: 3s
      interval: 5s
      retries: 3

  redis:
    container_name: redis
    image: redis:8-alpine
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - redis-data:/data
    # https://redis.io/docs/latest/operate/oss_and_stack/management/config/#passing-arguments-using-the-command-line
    command: redis-server --requirepass ${REDIS_PASSWORD}
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      start_period: 10s
      timeout: 3s
      interval: 5s
      retries: 3

  post-api:
    container_name: post-api
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        SERVICE_NAME: post
    ports:
      - "8080:8080"
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      TZ: Asia/Tokyo
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  document-api:
    container_name: document-api
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        SERVICE_NAME: document
    ports:
      - "8081:8080"
    environment:
      TZ: Asia/Tokyo

volumes:
  mysql-data:
  redis-data:
